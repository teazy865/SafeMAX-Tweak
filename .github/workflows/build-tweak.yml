name: Build SafeMAX Tweak IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the original SafeMAX IPA (leave empty to use SafeMAX.ipa from repo)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install ldid
          git clone https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib && xcodebuild -scheme insert_dylib -configuration Release -derivedDataPath /tmp/insert_dylib_dd
          sudo cp /tmp/insert_dylib_dd/Build/Products/Release/insert_dylib /usr/local/bin/

      - name: Prepare IPA
        run: |
          if [ -n "${{ github.event.inputs.ipa_url }}" ]; then
            curl -L -o SafeMAX.ipa "${{ github.event.inputs.ipa_url }}"
          elif [ -f SafeMAX.ipa ]; then
            echo "Using SafeMAX.ipa from repo"
          else
            echo "No IPA URL provided and no SafeMAX.ipa in repo."
            exit 1
          fi

      - name: Extract IPA
        run: |
          unzip -q SafeMAX.ipa -d extracted
          APP=$(find extracted/Payload -name "*.app" | head -1)
          echo "APP=$APP" >> $GITHUB_ENV
          # Detect main binary
          BINARY=$(basename "$APP" .app)
          if [ -f "$APP/$BINARY" ]; then
            echo "BINARY=$BINARY" >> $GITHUB_ENV
          else
            # Fallback: first executable
            BINARY=$(find "$APP" -maxdepth 1 -type f -perm +111 | head -1 | xargs basename)
            echo "BINARY=$BINARY" >> $GITHUB_ENV
          fi
          echo "Detected binary: $BINARY"

      - name: Allow background location
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes: string location" "$APP/Info.plist" || true
          python3 - << 'PY'
          import os, pathlib, subprocess
          app = pathlib.Path(os.environ["APP"])
          for path in [app / "Info.plist", *app.rglob("Info.plist"), *app.rglob("InfoPlist.strings")]:
              if not path.is_file():
                  continue
              subprocess.run(["plutil", "-convert", "xml1", str(path)], check=False)
              data = path.read_bytes().replace(b"SafeMAX", b"MAX")
              path.write_bytes(data)
          subprocess.run(["/usr/libexec/PlistBuddy", "-c", "Set :CFBundleDisplayName MAX", str(app / "Info.plist")], check=False)
          subprocess.run(["/usr/libexec/PlistBuddy", "-c", "Set :CFBundleName MAX", str(app / "Info.plist")], check=False)
          subprocess.run(["/usr/libexec/PlistBuddy", "-c", "Print :CFBundleDisplayName", str(app / "Info.plist")], check=False)
          PY
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist"

      - name: Build tweak dylib
        run: |
          clang -dynamiclib \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework QuartzCore \
            -framework AVFoundation \
            -framework UserNotifications \
            -framework CoreLocation \
            -fobjc-arc \
            -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -miphoneos-version-min=15.0 \
            -o SafeMAXBarTweak.dylib \
            tweak/SafeMAXBarTweak.m
          ldid -S SafeMAXBarTweak.dylib
          echo "Dylib built successfully"
          ls -lh SafeMAXBarTweak.dylib

      - name: Inject dylib
        run: |
          cp SafeMAXBarTweak.dylib "$APP/"
          echo "Injecting into $APP/$BINARY"
          insert_dylib @executable_path/SafeMAXBarTweak.dylib "$APP/$BINARY" --inplace --all-yes || \
          insert_dylib @executable_path/SafeMAXBarTweak.dylib "$APP/$BINARY" --inplace
          echo "Injection done"

      - name: Resign app
        run: |
          ldid -S "$APP/$BINARY" || true
          find "$APP" -name "*.dylib" -exec ldid -S {} \; || true
          find "$APP/PlugIns" -name "*.appex" -exec sh -c 'ldid -S "$1/$(basename "$1" .appex)"' _ {} \; 2>/dev/null || true
          echo "Resign done"

      - name: Package IPA
        run: |
          cd extracted && zip -qr ../SafeMAX-tweaked.ipa Payload
          ls -lh ../SafeMAX-tweaked.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SafeMAX-tweaked
          path: SafeMAX-tweaked.ipa
          retention-days: 30
